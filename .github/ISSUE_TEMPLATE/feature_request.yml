name: Feature request
description: Propose a feature or a change for CrossMono
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please read the [roadmap](https://github.com/nandanito/crossmono/blob/main/docs/roadmap.md) first: it may already be planned.

        CrossMono is reading-first firmware for the PaperMono. It adds what the PaperMono hardware can do beyond CrossPoint (LEDs, buzzer, motion sensor, timer wake, NFC, LoRa, microphone).
        An idea that would help every CrossPoint device (reading, formats, fonts, the web tools) belongs in [CrossPoint](https://github.com/crosspoint-reader/crosspoint-reader/discussions).

        Not sure? Start a [discussion](https://github.com/nandanito/crossmono/discussions) instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you post
      options:
        - label: I read the roadmap, and this is not already planned there.
          required: true
        - label: This is about the PaperMono, or about how CrossMono is installed, updated or released, not a feature for every CrossPoint device.
          required: true

  - type: dropdown
    id: model
    attributes:
      label: Model
      description: Which model is this for?
      options:
        - Both
        - PaperMono only (needs NFC or LoRa)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that you cannot do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should CrossMono do? Focus on what you see and do on the device.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Links, photos, other firmware that already does this.
