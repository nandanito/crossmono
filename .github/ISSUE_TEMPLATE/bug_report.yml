name: Bug report
description: Something in CrossMono does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please check the [open issues](https://github.com/nandanito/crossmono/issues) first.

        A security problem? Do not report it here: see [SECURITY.md](https://github.com/nandanito/crossmono/blob/main/SECURITY.md).

  - type: dropdown
    id: model
    attributes:
      label: Model
      description: Settings → System → About shows the model.
      options:
        - PaperMono
        - PaperMono-Lite
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CrossMono version
      description: The "Firmware" row in Settings → System → About.
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install this version?
      options:
        - Install page (crossmono.github.io)
        - esptool
        - Update over Wi-Fi
        - My own build
    validations:
      required: true

  - type: dropdown
    id: crosspoint
    attributes:
      label: Does the same thing happen with CrossPoint on this device?
      description: If it does, the bug is probably in CrossPoint, and we may forward it there.
      options:
        - Not tested
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happens
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open '...'
        2. Press '...'
        3. See '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or photos
      description: A serial log if you have one, or a photo of the screen. You can drag and drop images here.
