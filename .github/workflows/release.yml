name: Release

# CrossMono releases (ADR 0009, RELEASING.md). Replaces upstream's workflow, which
# attaches CrossPoint's assets to a release published by hand. Here a pushed tag
# is built, checked and packaged, and the GitHub release is created from it.
# A dry run (started by hand) builds the branch it runs on, names the assets after
# the tag input, and stops after uploading them as a workflow artifact.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example 0.1.0 or 0.1.0-rc.1'
        required: true
        type: string
      dry_run:
        description: 'Build and package only; create no release'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# Dry runs queue apart, so one cannot replace a release waiting in the queue.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'dry-run' || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      rc: ${{ steps.release.outputs.rc }}
      dry_run: ${{ steps.release.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          # A release started by hand builds its tag, which must exist already; a dry
          # run builds the branch it was started on. A tag push builds that tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && format('refs/tags/{0}', inputs.tag) || '' }}
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Check the tag and the CHANGELOG
        id: release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          # The tag must match [crossmono] version; prints env= and rc=.
          python3 scripts/mono/package_release.py --tag "$TAG" --check-tag | tee -a "$GITHUB_OUTPUT"
          {
            echo "tag=$TAG"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"
          if ! python3 scripts/mono/changelog.py "$TAG" > release-notes.md; then
            if [ "$DRY_RUN" != true ]; then exit 1; fi
            echo "::warning::CHANGELOG.md has no usable section for $TAG; a release would stop here"
            echo "No CHANGELOG section for $TAG (dry run)." > release-notes.md
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside the platform penv
        env:
          PIO_ENV: ${{ steps.release.outputs.env }}
        run: |
          set -euo pipefail
          # Kept as in ci.yml: the platform's penv core must match the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build ${{ steps.release.outputs.env }}
        # No PlatformIO cache in this workflow: the full image is written only by a real link.
        # Upstream's LCP release key is not set; CrossMono releases have no LCP enrollment.
        env:
          PIO_ENV: ${{ steps.release.outputs.env }}
          CROSSMONO_RC: ${{ steps.release.outputs.rc }}
        run: pio run -e "$PIO_ENV"

      - name: Write the licence file
        # Every licence in one text, from the libraries this build downloaded (ADR 0009, addendum 2026-11-06).
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PIO_ENV: ${{ steps.release.outputs.env }}
        run: python3 scripts/mono/release_license.py --tag "$TAG" --env "$PIO_ENV" --out "$RUNNER_TEMP/LICENSE.txt"

      - name: Package the release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 scripts/mono/package_release.py --tag "$TAG" --license "$RUNNER_TEMP/LICENSE.txt" \
            --out dist --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the release assets
        uses: actions/upload-artifact@v6
        with:
          name: crossmono-${{ steps.release.outputs.tag }}
          path: |
            dist/
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the release assets
        uses: actions/download-artifact@v7
        with:
          name: crossmono-${{ needs.build.outputs.tag }}
          path: release

      - name: Check the assets
        working-directory: release/dist
        run: sha256sum -c SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          RC: ${{ needs.build.outputs.rc }}
        run: |
          set -euo pipefail
          # Release candidates are pre-releases, so releases/latest (the updater) never returns them.
          if [ -n "$RC" ]; then kind=--prerelease; else kind=--latest; fi
          gh release create "$TAG" release/dist/* --repo "$GITHUB_REPOSITORY" --verify-tag "$kind" \
            --title "CrossMono $TAG" --notes-file release/release-notes.md
